# nginx/nginx.conf

server {
    # Nginx will listen on port 80 inside the container.
    listen 80;

    # This block applies to all incoming requests.
    location / {
        # This is a simple but effective security measure. It checks for an
        # 'Authorization' header. If it's missing or doesn't match our secret
        # key, it returns a 401 Unauthorized error.

        # Replace 'MLEXPERT_RULES' with a real secret in production.
        if ($http_authorization != "Bearer MLEXPERT_RULES") {
            return 401;
        }

        # PROXY LOGIC: Forward the request to the vLLM service
        # 'vllm' is the service name defined in our docker-compose.yml
        # Docker's internal DNS resolves this to the vLLM container's IP.
        proxy_pass http://vllm:8000;

        # These headers are best practice for reverse proxies. They pass along
        # information about the original request to the upstream service (vLLM).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}