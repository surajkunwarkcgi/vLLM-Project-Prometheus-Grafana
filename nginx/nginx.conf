# nginx/nginx.conf

# Per-client rate limit, keyed on the Authorization header
limit_req_zone $http_authorization zone=llm:10m rate=10r/s;

# Auth check with map instead of "if" (the Nginx docs warn against "if" in location blocks)
map $http_authorization $auth_ok {
    default                 0;
    "Bearer MLEXPERT_RULES" 1;
}

server {
    # Nginx will listen on port 80 inside the container.
    listen 80;

    # This block applies to all incoming requests.
    location / {
        if ($auth_ok = 0) { return 401; }

        limit_req zone=llm burst=20 nodelay;
        limit_req_status 429;

        # PROXY LOGIC: Forward the request to the vLLM service
        # 'vllm' is the service name defined in our docker-compose.yml
        # Docker's internal DNS resolves this to the vLLM container's IP.
        proxy_pass http://vllm:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Streaming (SSE) needs buffering off
        proxy_buffering off;
        proxy_cache off;

        # LLM responses can be long
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_max_body_size  10m;

        # These headers are best practice for reverse proxies. They pass along
        # information about the original request to the upstream service (vLLM).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated health check for Docker or a load balancer
    location = /health {
        proxy_pass http://vllm:8000/health;
    }
}